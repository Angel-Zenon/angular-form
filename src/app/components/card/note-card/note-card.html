<div class="list-container">
    <h3>Tus notas ({{ notes().length }})</h3>
    <ul>
        @for (note of notes(); track note) {
            <div class="li-container" [class]="'border-' + note.priority.toLowerCase()" >
                <!-- border-alta , meda, baja -->
                <li> {{ note.description }} </li>
                <span>Prioridad {{ note.priority }} </span>
            </div>
        }
    </ul>
</div>
