<div class="contaner-counter">
    <h1>Counter {{ counter }} </h1>  <!--Las señales se invocan como una funcion()-->
    <h1>Counter {{ counterSignal() }} </h1>  <!--Las señales se invocan como una funcion()-->
    <button (click)="increaseBy(1)">Incrementar</button>
    <button (click)="increaseBy(-1)">Decrementar</button>
    <button (click)="resset()">Resetear a 0</button>
</div>
